            Saccade и её аффилированные лица могут использовать эти данные, чтобы готовить со Стороной договоры, счета, налоговые формы и другие документы и платить Стороне. Платёж от Saccade или её аффилированного лица либо за них на счёт из части 2 — или на другой счёт, который Сторона сообщила в порядке, описанном ниже, — считается платежом Стороне в отправленной сумме. Если владелец счёта — не Сторона, Сторона поручает Saccade платить на этот счёт и подтверждает, что владелец согласился принимать платежи за неё; Saccade вправе отказаться платить на счёт, который принадлежит не Стороне. Каждая сторона оплачивает комиссии своего банка, комиссии банков-посредников — Сторона. Если платёж вернулся из-за неверных или неполных данных, Saccade отправит его снова, когда деньги вернутся, за вычетом удержанных с них комиссий.

            Об изменении данных Сторона сообщает, подписав новую форму Saccade с новыми данными или написав на legal@saccadeproduction.com. Saccade вправе исходить из этих данных, пока не получит сообщение и не пройдёт разумный срок на его проверку. Любое изменение банковских реквизитов, как бы оно ни пришло, Saccade вправе проверить через контакт, который у неё уже есть, а не через указанный вместе с изменением; платёж, задержанный из-за такой проверки, не считается просроченным.

            Сама по себе эта форма не обязывает Saccade привлекать Сторону или платить ей. Если договор между Saccade и Стороной по какому-либо вопросу этой части 3 устанавливает иное, действует договор. Форма регулируется правом штата Делавэр.
