  # --- W-8BEN (шаблон «W-8BEN», папка Tax forms; сборщик docuseal-templates/w8_tpl.rb) ---
  Line 1. Name of individual who is the beneficial owner:
    title_ru: Строка 1. Имя физлица — фактического получателя дохода
    hint:
      en: |-
        Your full name as in your passport, in Latin letters. Fill in the whole form in English.

        **Privacy notice.** Saccade Media House, Inc. (Delaware, USA; contact: legal@saccadeproduction.com) collects the details you enter in this form (name, citizenship, addresses, tax numbers, date of birth, tax treaty details, signature) and the technical data recorded automatically when you sign (IP address, device, time zone, the language you chose, time of each step).

        We use them to document your foreign status for U.S. tax withholding and reporting on payments we make to you, and to keep the form and proof of it as U.S. tax law requires. The legal basis is the need to perform our contract with you, and our legitimate interests in complying with U.S. tax law, in keeping proof of the form and in establishing, exercising or defending legal claims. You are not legally required to provide the details, but without the required fields the form cannot be signed, and without a valid form we may be unable to pay you or may have to apply U.S. withholding and reporting rules.

        The data is stored for us by Hetzner on our server in Germany and on Google Drive. On Google Drive we keep backups, encrypted with our key before upload so that Google cannot read them, and copies of the signed form and its signing record. Signing emails are sent through our email provider Spacemail. We work with the data from the USA and Israel; Israel has an EU adequacy decision, the USA has none that covers us, and we transfer the data there because it is necessary to perform our contract with you (Art. 49(1)(b) GDPR).

        Apart from these providers, we disclose it only to our legal and accounting advisers, to banks and payment providers that ask for it to make payments to you, and to the U.S. Internal Revenue Service, courts or other authorities where the law requires it.

        We keep it while we make payments to you under this form and afterwards for as long as it may be relevant to our U.S. tax obligations for those payments or claims about them can be brought.

        You may ask us at legal@saccadeproduction.com to see, correct or delete your data, to receive a copy of it, or to restrict or object to its use; we may keep what the law requires us to keep or what we need to establish, exercise or defend legal claims. You may also complain to the data protection authority of the country where you live or work.
      ru: |-
        Полное имя как в паспорте, латиницей. Всю форму заполняйте по-английски.

        Перевод для удобства: форма W-8BEN — официальная форма Налоговой службы США (IRS) на английском языке; при расхождении перевода с английским текстом действует английский.

        **Уведомление о данных.** Saccade Media House, Inc. (Делавэр, США; legal@saccadeproduction.com) собирает данные, которые вы вводите в эту форму (имя, гражданство, адреса, налоговые номера, дата рождения, данные о налоговом соглашении, подпись), и технические данные, которые записываются автоматически при подписи (IP-адрес, устройство, часовой пояс, выбранный язык, время каждого шага).

        Они нужны, чтобы подтвердить ваш статус иностранного лица для удержания налога США и отчётности по нашим выплатам вам и хранить форму и доказательство её подписи, как требует налоговый закон США. Правовое основание — необходимость исполнять наш договор с вами и наш законный интерес соблюдать налоговый закон США, хранить доказательство формы и предъявлять требования или защищаться от них. По закону давать данные не обязательно, но без обязательных полей форму не подписать, а без действующей формы мы можем не суметь заплатить вам или будем обязаны применить правила удержания и отчётности США.

        Данные хранятся для нас у Hetzner на нашем сервере в Германии и на Google Диске. На Google Диске лежат резервные копии, зашифрованные нашим ключом до загрузки (их Google прочитать не может), и копии подписанной формы и журнала подписи. Письма о подписи уходят через нашего почтового провайдера Spacemail. С данными работаем из США и Израиля; для Израиля есть решение ЕС об адекватности, для нас в США — нет, и мы передаём данные туда, потому что это необходимо для исполнения нашего договора с вами (ст. 49(1)(b) Общего регламента ЕС о защите данных).

        Кроме этих провайдеров, передаём данные только нашим юристам и бухгалтерам, банкам и платёжным сервисам, которые запрашивают их для выплат вам, и Налоговой службе США, суду или другим органам, когда этого требует закон.

        Храним, пока платим вам по этой форме, и после — пока она может быть важна для наших налоговых обязанностей в США по этим выплатам или пока по ним можно предъявить требования.

        Напишите на legal@saccadeproduction.com, чтобы посмотреть, исправить или удалить свои данные, получить их копию, ограничить их использование или возразить против него; то, что мы обязаны хранить по закону или что нужно для требований и защиты от них, мы можем сохранить. Пожаловаться можно также в орган по защите данных страны, где вы живёте или работаете.
