    title_ru: Строка 15. Дополнительные условия
    hint:
      en: The additional conditions in that article that the company meets to be eligible for this rate, in English.
      ru: Дополнительные условия этой статьи, которым компания соответствует для этой ставки, по-английски.
  I certify that I have the capacity to sign for the entity identified on line 1:
    title_ru: Подтверждаю, что вправе подписывать за компанию из строки 1
    hint:
      en: 'The form must be signed by an officer or another person authorized to sign for the company (for example a director). Tick to confirm that you are. If you are not, do not sign — write to legal@saccadeproduction.com and we will send the form to the right person. If you sign under a power of attorney, write to us too: the power of attorney must be attached to the form.'
      ru: 'Форму подписывает руководитель или другой человек, который вправе подписывать за компанию (например, директор). Отметьте, чтобы это подтвердить. Если вы не вправе — не подписывайте, напишите на legal@saccadeproduction.com, и мы отправим форму нужному человеку. Если подписываете по доверенности — тоже напишите нам: доверенность нужно приложить к форме.'
  Print name of authorized signer:
    title_ru: Имя подписанта
    hint:
      en: Your full name in Latin letters.
      ru: Ваше полное имя латиницей.
  Signature of individual authorized to sign for beneficial owner:
    title_ru: Подпись
    hint:
      en: |-
        **By signing, you make the following certification (Part XXX of the form) under penalties of perjury.** Read it before you sign.

        Under penalties of perjury, I declare that I have examined the information on this form and to the best of my knowledge and belief it is true, correct, and complete. I further certify under penalties of perjury that:

        • The entity identified on line 1 of this form is the beneficial owner of all the income or proceeds to which this form relates, is using this form to certify its status for chapter 4 purposes, or is submitting this form for purposes of section 6050W or 6050Y;

        • The entity identified on line 1 of this form is not a U.S. person;

        • This form relates to: (a) income not effectively connected with the conduct of a trade or business in the United States, (b) income effectively connected with the conduct of a trade or business in the United States but is not subject to tax under an income tax treaty, (c) the partner’s share of a partnership’s effectively connected taxable income, or (d) the partner’s amount realized from the transfer of a partnership interest subject to withholding under section 1446(f); and

