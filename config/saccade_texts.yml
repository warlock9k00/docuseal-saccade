  Individual: Физлицо
  Sole proprietor: ИП
  Entity: Компания
title_patterns_ru:
  "\\ASignature p\\.\\s*(\\d+)\\z": Подпись, с. \1
  "\\ADate p\\.\\s*(\\d+)\\z": Дата, с. \1
