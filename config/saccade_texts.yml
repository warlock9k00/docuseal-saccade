  Signature of beneficial owner:
    title_ru: Подпись
    hint:
      en: |-
        **By signing, you make the following certification (Part III of the form) under penalties of perjury.** Read it before you sign.

        Under penalties of perjury, I declare that I have examined the information on this form and to the best of my knowledge and belief it is true, correct, and complete. I further certify under penalties of perjury that:

        • I am the individual that is the beneficial owner (or am authorized to sign for the individual that is the beneficial owner) of all the income or proceeds to which this form relates or am using this form to document myself for chapter 4 purposes;

        • The person named on line 1 of this form is not a U.S. person;

        • This form relates to: (a) income not effectively connected with the conduct of a trade or business in the United States; (b) income effectively connected with the conduct of a trade or business in the United States but is not subject to tax under an applicable income tax treaty; (c) the partner’s share of a partnership’s effectively connected taxable income; or (d) the partner’s amount realized from the transfer of a partnership interest subject to withholding under section 1446(f);

        • The person named on line 1 of this form is a resident of the treaty country listed on line 9 of the form (if any) within the meaning of the income tax treaty between the United States and that country; and

        • For broker transactions or barter exchanges, the beneficial owner is an exempt foreign person as defined in the instructions.

        Furthermore, I authorize this form to be provided to any withholding agent that has control, receipt, or custody of the income of which I am the beneficial owner or any withholding agent that can disburse or make payments of the income of which I am the beneficial owner. I agree that I will submit a new form within 30 days if any certification made on this form becomes incorrect.

        Your signature is the last step: when you sign and press Complete, the form is sent. Draw your signature with your finger or mouse. The form is marked as signed electronically, and the date and time of signing are recorded.
      ru: |-
        **Подписывая, вы делаете это заявление (раздел III формы) под страхом наказания за лжесвидетельство.** Прочитайте его до подписи. Перевод для удобства: в форме — английский текст, действует он.

        Под страхом наказания за лжесвидетельство заявляю, что проверил(а) сведения в этой форме и, насколько мне известно и по моему убеждению, они верны, точны и полны. Также под страхом наказания за лжесвидетельство подтверждаю, что:

        • я — физлицо, которое является фактическим получателем (бенефициаром) всех доходов или поступлений, к которым относится эта форма (или вправе подписывать за такое физлицо), либо использую эту форму, чтобы подтвердить свой статус для целей главы 4;

        • лицо из строки 1 этой формы не является «лицом США»;

        • форма относится: (a) к доходу, не связанному фактически с ведением торговли или бизнеса в США; (b) к доходу, фактически связанному с ведением торговли или бизнеса в США, но не облагаемому налогом по применимому соглашению о подоходном налоге; (c) к доле партнёра в фактически связанном облагаемом доходе партнёрства; или (d) к сумме, полученной партнёром при передаче доли в партнёрстве, с которой удерживается налог по разделу 1446(f);

        • лицо из строки 1 этой формы — резидент страны соглашения, указанной в строке 9 (если указана), в смысле соглашения о подоходном налоге между США и этой страной; и

        • для брокерских операций и бартерных обменов фактический получатель — освобождённое иностранное лицо, как определено в инструкции.

        Кроме того, разрешаю передавать эту форму любому налоговому агенту, который контролирует, получает или хранит доход, фактическим получателем которого я являюсь, либо который может распоряжаться таким доходом или выплачивать его. Обязуюсь подать новую форму в течение 30 дней, если любое заявление в этой форме станет неверным.

        Подпись — последний шаг: когда вы подпишете и нажмёте «Завершить», форма уйдёт. Нарисуйте подпись пальцем или мышью. В форме будет отметка, что она подписана электронно; дата и время подписи записываются.
  Date (MM-DD-YYYY):
    title_ru: Дата (ММ-ДД-ГГГГ)
  Signed electronically:
    title_ru: Подписано электронно
  # --- W-8BEN-E (шаблон «W-8BEN-E», папка Tax forms; сборщик docuseal-templates/w8e_tpl.rb) ---
  Line 1. Name of organization that is the beneficial owner:
    title_ru: Строка 1. Название компании — фактического получателя дохода
    hint:
      en: |-
        The company's full legal name, as in its registration documents, in Latin letters. Fill in the whole form in English. This form is for companies; if you work with us as an individual or a sole proprietor, ask legal@saccadeproduction.com for Form W-8BEN instead.

        **Privacy notice.** Saccade Media House, Inc. (Delaware, USA; contact: legal@saccadeproduction.com) collects the details you enter in this form (the company's name, country, status, addresses, tax numbers and tax treaty details; your name, email address and signature as the person signing for it) and the technical data recorded automatically when you sign (IP address, device, time zone, the language you chose, time of each step).

        We use them to document the company's foreign status for U.S. tax withholding and reporting on payments we make to it, and to keep the form and proof of it as U.S. tax law requires. The legal basis is our legitimate interests in performing our contract with the company, in complying with U.S. tax law, in keeping proof of the form and in establishing, exercising or defending legal claims. You are not legally required to provide the details, but without the required fields the form cannot be signed, and without a valid form we may be unable to pay the company or may have to apply U.S. withholding and reporting rules.

        The data is stored for us by Hetzner on our server in Germany and on Google Drive. On Google Drive we keep backups, encrypted with our key before upload so that Google cannot read them, and copies of the signed form and its signing record. Signing emails are sent through our email provider Spacemail. We work with the data from the USA and Israel; Israel has an EU adequacy decision, the USA has none that covers us, and we transfer the data there because it is necessary to perform our contract with the company, which is concluded in your interest as the person who represents it (Art. 49(1)(c) GDPR).

        Apart from these providers, we disclose it only to our legal and accounting advisers, to banks and payment providers that ask for it to make payments to the company, and to the U.S. Internal Revenue Service, courts or other authorities where the law requires it.

        We keep it while we make payments to the company under this form and afterwards for as long as it may be relevant to our U.S. tax obligations for those payments or claims about them can be brought.

        You may ask us at legal@saccadeproduction.com to see, correct or delete your data, to receive a copy of it, or to restrict or object to its use; we may keep what the law requires us to keep or what we need to establish, exercise or defend legal claims. You may also complain to the data protection authority of the country where you live or work.
      ru: |-
        Полное юридическое название компании, как в регистрационных документах, латиницей. Всю форму заполняйте по-английски. Эта форма — для компаний; если вы работаете с нами как физлицо или ИП, попросите на legal@saccadeproduction.com форму W-8BEN.

        Перевод для удобства: форма W-8BEN-E — официальная форма Налоговой службы США (IRS) на английском языке; при расхождении перевода с английским текстом действует английский.

        **Уведомление о данных.** Saccade Media House, Inc. (Делавэр, США; legal@saccadeproduction.com) собирает данные, которые вы вводите в эту форму (название, страну, статус, адреса, налоговые номера компании и данные о налоговом соглашении; ваши имя, адрес почты и подпись как лица, подписывающего за компанию), и технические данные, которые записываются автоматически при подписи (IP-адрес, устройство, часовой пояс, выбранный язык, время каждого шага).

        Они нужны, чтобы подтвердить статус компании как иностранного лица для удержания налога США и отчётности по нашим выплатам ей и хранить форму и доказательство её подписи, как требует налоговый закон США. Правовое основание — наш законный интерес исполнять договор с компанией, соблюдать налоговый закон США, хранить доказательство формы и предъявлять требования или защищаться от них. По закону давать данные не обязательно, но без обязательных полей форму не подписать, а без действующей формы мы можем не суметь заплатить компании или будем обязаны применить правила удержания и отчётности США.

        Данные хранятся для нас у Hetzner на нашем сервере в Германии и на Google Диске. На Google Диске лежат резервные копии, зашифрованные нашим ключом до загрузки (их Google прочитать не может), и копии подписанной формы и журнала подписи. Письма о подписи уходят через нашего почтового провайдера Spacemail. С данными работаем из США и Израиля; для Израиля есть решение ЕС об адекватности, для нас в США — нет, и мы передаём данные туда, потому что это необходимо для исполнения нашего договора с компанией, заключённого в ваших интересах как её представителя (ст. 49(1)(c) Общего регламента ЕС о защите данных).

        Кроме этих провайдеров, передаём данные только нашим юристам и бухгалтерам, банкам и платёжным сервисам, которые запрашивают их для выплат компании, и Налоговой службе США, суду или другим органам, когда этого требует закон.

        Храним, пока платим компании по этой форме, и после — пока она может быть важна для наших налоговых обязанностей в США по этим выплатам или пока по ним можно предъявить требования.

        Напишите на legal@saccadeproduction.com, чтобы посмотреть, исправить или удалить свои данные, получить их копию, ограничить их использование или возразить против него; то, что мы обязаны хранить по закону или что нужно для требований и защиты от них, мы можем сохранить. Пожаловаться можно также в орган по защите данных страны, где вы живёте или работаете.
  Line 2. Country of incorporation or organization:
    title_ru: Строка 2. Страна регистрации компании
    hint:
      en: The country under whose laws the company is created, in English, for example Israel. A U.S. company must not sign this form — write to legal@saccadeproduction.com.
      ru: Страна, по законам которой создана компания, по-английски, например Israel. Компания из США эту форму не подписывает — напишите на legal@saccadeproduction.com.
  Line 3. Name of disregarded entity receiving the payment:
    title_ru: Строка 3. Название «прозрачной» компании, получающей платёж
    hint:
      en: In almost all cases leave it empty and press Next. It is filled in only by a disregarded entity that has a GIIN (a FATCA registration number); if that is your case, write to legal@saccadeproduction.com first.
      ru: Почти всегда оставьте пустым и нажмите «Далее». Заполняет только «прозрачная» для налогов США компания с номером GIIN (регистрация по FATCA); если это ваш случай — сначала напишите на legal@saccadeproduction.com.
  'Line 4. Chapter 3 status: Corporation':
    title_ru: 'Строка 4. Тип компании по налоговым правилам США: корпорация'
    hint:
      en: Tick to confirm that the company is a corporation under U.S. tax rules (it is classified under U.S. rules, not under the law of your country). A foreign company whose owners all have limited liability (for example Ltd, LLC, GmbH, OOO) is a corporation for U.S. tax purposes, unless it has filed Form 8832 with the IRS to be treated otherwise. If the company is a partnership, a trust, a disregarded entity (for example a company with a single owner that has elected to be disregarded, or whose single owner has unlimited liability), a government body or any other type, or if you are not sure, do not sign this form — write to legal@saccadeproduction.com.
      ru: Отметьте, чтобы подтвердить, что компания — корпорация по налоговым правилам США (считается по правилам США, а не по законам вашей страны). Иностранная компания, все владельцы которой отвечают ограниченно (например, Ltd, LLC, GmbH, ООО), для налогов США — корпорация, если только она не подавала в IRS форму 8832, чтобы её считали иначе. Если компания — партнёрство, траст, «прозрачная» компания (например, с одним владельцем, выбравшая такой статус, или с владельцем, который отвечает неограниченно), госорган или другого типа, или вы не уверены — не подписывайте эту форму, напишите на legal@saccadeproduction.com.
  Line 5. Chapter 4 status (FATCA status):
    title_ru: Строка 5. Статус по FATCA
    hint:
      en: 'Needed only for certain U.S.-source payments such as royalties or interest; for payments for services it is not required, so if none of the options clearly fits, leave it empty and press Next. Active NFFE — a company that is not a bank, fund or other financial institution and earns mostly from its own business (for example production or creative services): less than 50% of its income last year and less than 50% of its assets are passive (dividends, interest, rents, royalties and similar; rents and royalties the company earns from its own active business, through its own employees, do not count as passive). Passive NFFE — a non-financial company that does not meet that test, for example a holding company. Next you confirm the status you chose (Part XXV or XXVI). If the company is a financial institution or has another status, write to legal@saccadeproduction.com.'
      ru: 'Нужна только для некоторых выплат из источников в США, например роялти или процентов; для оплаты услуг строка не обязательна — если ни один вариант точно не подходит, оставьте пустой и нажмите «Далее». «Активная нефинансовая компания» — не банк, не фонд и не другая финансовая организация, зарабатывает в основном своим бизнесом (например, продакшн или творческие услуги): меньше 50% дохода за прошлый год и меньше 50% активов — пассивные (дивиденды, проценты, аренда, роялти и т. п.; аренда и роялти от собственной активной деятельности компании, которую ведут её сотрудники, пассивными не считаются). «Пассивная» — нефинансовая компания, которая этому не соответствует, например холдинг. Дальше вы подтвердите выбранный статус (раздел XXV или XXVI). Если компания — финансовая организация или у неё другой статус, напишите на legal@saccadeproduction.com.'
  Line 39. Active NFFE certification:
    title_ru: 'Строка 39. Подтверждение: активная нефинансовая компания'
    hint:
      en: |-
        Tick to make this certification (Part XXV of the form):

        I certify that: • The entity identified in Part I is a foreign entity that is not a financial institution; • Less than 50% of such entity’s gross income for the preceding calendar year is passive income; and • Less than 50% of the assets held by such entity are assets that produce or are held for the production of passive income (calculated as a weighted average of the percentage of passive assets measured quarterly) (see instructions for the definition of passive income).
      ru: |-
        Отметьте, чтобы сделать это заявление (раздел XXV формы). Перевод для удобства, действует английский текст:

        Подтверждаю, что: • компания из раздела I — иностранная компания и не финансовая организация; • меньше 50% её валового дохода за прошлый календарный год — пассивный доход; и • меньше 50% её активов — активы, которые приносят пассивный доход или держатся для его получения (средневзвешенная доля пассивных активов по поквартальным замерам; что такое пассивный доход — в инструкции).
  Line 40a. Passive NFFE certification:
    title_ru: 'Строка 40a. Подтверждение: пассивная нефинансовая компания'
    hint:
      en: |-
        Tick to make this certification (Part XXVI of the form):

        I certify that the entity identified in Part I is a foreign entity that is not a financial institution (other than an investment entity organized in a possession of the United States) and is not certifying its status as a publicly traded NFFE (or affiliate), excepted territory NFFE, active NFFE, direct reporting NFFE, or sponsored direct reporting NFFE.
      ru: |-
        Отметьте, чтобы сделать это заявление (раздел XXVI формы). Перевод для удобства, действует английский текст:

        Подтверждаю, что компания из раздела I — иностранная компания, не финансовая организация (кроме инвестиционной компании, созданной на территории, находящейся во владении США) и не заявляет статус публичной NFFE (или её аффилированного лица), освобождённой NFFE территории, находящейся во владении США, активной NFFE, NFFE с прямой отчётностью или спонсируемой NFFE с прямой отчётностью.
  Line 40b. No substantial U.S. owners:
    title_ru: Строка 40b. Нет существенных владельцев из США
    hint:
      en: |-
        Tick to certify: I further certify that the entity identified in Part I has no substantial U.S. owners (or, if applicable, no controlling U.S. persons).

        A substantial U.S. owner is generally a U.S. citizen, U.S. resident or U.S. company that owns, directly or indirectly, more than 10% of the company. If the company has one, do not sign this form — write to legal@saccadeproduction.com.
      ru: |-
        Отметьте, чтобы подтвердить (перевод для удобства, действует английский текст): компания из раздела I не имеет существенных владельцев из США (или, если применимо, контролирующих лиц из США).

        Существенный владелец из США — обычно гражданин, резидент или компания США, которые прямо или косвенно владеют более чем 10% компании. Если такой есть, не подписывайте эту форму — напишите на legal@saccadeproduction.com.
  Line 6. Permanent residence address:
    title_ru: Строка 6. Адрес постоянного местонахождения компании
    hint:
      en: Street, building, office — the company's address in the country where it is a tax resident (usually its registered address), in Latin letters. Not a P.O. box or an in-care-of address (a registered address is fine).
      ru: Улица, дом, офис — адрес компании в стране её налогового резидентства (обычно юридический адрес), латиницей. Не абонентский ящик и не адрес «для передачи» (юридический адрес подходит).
  Line 6. City or town, state or province, postal code:
    title_ru: Строка 6. Город, регион, индекс
    hint:
      en: In Latin letters.
      ru: Латиницей.
  Line 6. Country:
    title_ru: Строка 6. Страна
    hint:
      en: In English, for example Israel.
      ru: По-английски, например Israel.
  The entity's mailing address is different:
    title_ru: Почтовый адрес компании другой
    hint:
      en: Tick only if the company gets mail at a different address — then fill in line 7. Otherwise leave it and press Next.
      ru: Отметьте, только если компания получает почту по другому адресу, — тогда заполните строку 7. Иначе просто нажмите «Далее».
  Line 7. Mailing address:
    title_ru: Строка 7. Почтовый адрес
    hint:
      en: Street, building, office, in Latin letters.
      ru: Улица, дом, офис, латиницей.
  Line 7. City or town, state or province, postal code:
    title_ru: Строка 7. Город, регион, индекс
    hint:
      en: In Latin letters.
      ru: Латиницей.
  Line 7. Country:
    title_ru: Строка 7. Страна
    hint:
      en: In English.
      ru: По-английски.
  Line 8. U.S. taxpayer identification number (TIN):
    title_ru: Строка 8. Налоговый номер США (EIN)
    hint:
      en: Only if the company has one (EIN). No U.S. number — leave it empty and press Next.
      ru: Только если он у компании есть (EIN). Нет номера США — оставьте пустым и нажмите «Далее».
  Line 9b. Foreign TIN:
    title_ru: Строка 9b. Иностранный налоговый номер
    hint:
      en: The tax identification number issued to the company by the country where it is a tax resident (for example a company registration or VAT number, if that is its tax number). If it has none, leave it empty and see line 9c.
      ru: Налоговый номер, который компании выдала страна её налогового резидентства (например, регистрационный номер или номер плательщика НДС, если он и есть налоговый). Нет номера — оставьте пустым и посмотрите строку 9c.
  Line 9b. Foreign TIN (required with treaty benefits):
    title_ru: Строка 9b. Иностранный налоговый номер (обязателен при льготе)
    hint:
      en: The tax identification number issued to the company by the country where it is a tax resident (for example a company registration or VAT number, if that is its tax number). It is required because the company claims treaty benefits (line 14a). If the company has no such number, write to legal@saccadeproduction.com.
      ru: Налоговый номер, который компании выдала страна её налогового резидентства (например, регистрационный номер или номер плательщика НДС, если он и есть налоговый). Он обязателен, потому что компания заявляет льготу по соглашению (строка 14a). Если такого номера нет — напишите на legal@saccadeproduction.com.
  Line 9c. FTIN not legally required:
    title_ru: Строка 9c. Налоговый номер по закону не нужен
    hint:
      en: Tick only if you left line 9b empty because the company is not legally required to have a tax number in the country where it is a tax resident (for example, that country does not issue tax numbers to companies). Otherwise leave it.
      ru: Отметьте, только если оставили строку 9b пустой, потому что по закону страны налогового резидентства компании налоговый номер ей не нужен (например, страна не выдаёт компаниям налоговых номеров). Иначе не отмечайте.
  Line 10. Reference number(s):
    title_ru: Строка 10. Справочный номер
    hint:
      en: Leave it empty unless Saccade Media House asked you to enter a reference number.
      ru: Оставьте пустым, если Saccade Media House не просила указать номер.
  Line 14a. The entity claims treaty benefits as a resident of a treaty country:
    title_ru: Строка 14a. Компания заявляет льготу как резидент страны соглашения
    hint:
      en: Tick only if the company claims a reduced rate of, or exemption from, U.S. withholding under the income tax treaty between its country and the United States (Part III). For services performed entirely outside the United States no U.S. tax applies, and you do not need to claim treaty benefits. If the company performs services in the United States, claim the business profits article here (see line 15) or write to legal@saccadeproduction.com. If you tick, you will also give the company's foreign tax number (line 9b) and fill in lines 14a–15; this certifies that the beneficial owner is a resident of that country within the meaning of the treaty. Otherwise leave it and press Next. If unsure, ask your tax adviser.
      ru: Отметьте, только если компания заявляет пониженную ставку удержания налога США или освобождение от него по соглашению об избежании двойного налогообложения между её страной и США (раздел III). За услуги, оказанные целиком за пределами США, налог США не взимается, и льгота не нужна. Если компания оказывает услуги в США, заявите здесь льготу по статье о прибыли от предпринимательской деятельности (см. строку 15) или напишите на legal@saccadeproduction.com. Если отметите — дальше укажете иностранный налоговый номер компании (строка 9b) и заполните строки 14a–15; так вы подтверждаете, что компания — резидент этой страны в смысле соглашения. Иначе просто нажмите «Далее». Если не уверены — спросите своего налогового консультанта.
  Line 14a. Treaty country:
    title_ru: Строка 14a. Страна соглашения
    hint:
      en: The treaty country where the company is a resident, in English.
      ru: Страна соглашения, где компания резидент, по-английски.
  Line 14b. The entity meets the limitation on benefits requirements:
    title_ru: Строка 14b. Компания соответствует условиям об ограничении льгот
    hint:
      en: 'Tick to certify: the beneficial owner derives the item (or items) of income for which the treaty benefits are claimed, and, if applicable, meets the requirements of the treaty provision dealing with limitation on benefits. Next you choose the type of provision.'
      ru: 'Отметьте, чтобы подтвердить (перевод для удобства, действует английский текст): компания получает доход, по которому заявляет льготу, и, если применимо, соответствует условиям статьи соглашения об ограничении льгот. Дальше выберите тип такого условия.'
  Line 14b. Type of limitation on benefits provision:
    title_ru: Строка 14b. Тип условия об ограничении льгот
    hint:
      en: Choose the limitation on benefits test the company meets. If the treaty has no such article, choose “No LOB article in treaty”. If unsure, ask your tax adviser.
      ru: Выберите условие об ограничении льгот, которому соответствует компания. Если в соглашении такой статьи нет — «В соглашении нет статьи об ограничении льгот». Если не уверены — спросите своего налогового консультанта.
  'Line 14b. Other: article and paragraph':
    title_ru: Строка 14b. Другое — статья и пункт
    hint:
      en: The article and paragraph of the treaty with the limitation on benefits test the company meets.
      ru: Статья и пункт соглашения с условием об ограничении льгот, которому соответствует компания.
  Line 15. Article and paragraph of the treaty:
    title_ru: Строка 15. Статья и пункт соглашения
    hint:
      en: Fill in line 15 only if the company claims a special rate or conditions under a specific article — for example business profits for services performed in the United States when the company has no permanent establishment there, or a reduced rate for royalties. Otherwise leave lines 15 empty.
      ru: Строку 15 заполняйте, только если компания заявляет особую ставку или условия по конкретной статье — например, по прибыли от предпринимательской деятельности за услуги, оказанные в США, если у компании нет там постоянного представительства, или пониженную ставку для роялти. Иначе оставьте строки 15 пустыми.
  Line 15. Rate of withholding, %:
    title_ru: Строка 15. Ставка удержания, %
    hint:
      en: The rate of U.S. withholding the company claims, in percent.
      ru: Ставка удержания налога США, которую заявляет компания, в процентах.
  Line 15. Type of income:
    title_ru: Строка 15. Вид дохода
    hint:
      en: The type of income this rate applies to, in English.
      ru: Вид дохода, к которому применяется ставка, по-английски.
