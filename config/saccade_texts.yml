  'TEST - ': 'ТЕСТ — '
  " (check)": " (проверка)"
fields:
  Full name (as in passport, Latin):
    title_ru: Полное имя (как в паспорте, латиницей)
    hint:
      en: |-
        As in your passport, in Latin letters.

        **Privacy notice.** Saccade Media House, Inc. (Delaware, USA; contact: legal@saccadeproduction.com) collects the details you enter or upload in this form (name, status, address, tax ID, email, signature) and the technical data recorded automatically when you sign (IP address, device, time zone, the language you chose, time of each step).

        We use them to conclude this Agreement, perform it and keep proof of it. The legal basis is that this is necessary to conclude and perform the Agreement with you (if you sign for an entity, our legitimate interest in concluding it with that entity), and our legitimate interest in keeping proof of it and in establishing, exercising or defending legal claims. You are not legally required to provide them, but without the required fields the Agreement cannot be signed.

        The data is stored for us by Hetzner on our server in Germany and on Google Drive: in backups encrypted with our key before upload, which Google cannot read, and as copies of the signed Agreement and its signing record. Signing emails are sent through our email provider Spacemail. We work with the data from the USA and Israel; Israel has an EU adequacy decision, the USA has none that covers us.

        Apart from these providers, we disclose it only to the Affiliate that co-signs this Agreement, if any, to our legal and accounting advisers and, where needed to prove or enforce this Agreement, to the Client and Affiliates it protects, courts or authorities.

        We keep it while this Agreement is in force and afterwards for as long as claims under it can be brought.

        You may ask us at legal@saccadeproduction.com to see, correct or delete your data, to receive a copy of it, or to restrict or object to its use; we may keep what we still need to perform this Agreement or to establish, exercise or defend legal claims. You may also complain to the data protection authority of the country where you live or work.
      ru: |-
        Как в паспорте, латиницей.

        Перевод для удобства: договор составлен на английском (п. 9.6); при расхождении этого перевода с английским текстом действует английский.

        **Уведомление о данных.** Saccade Media House, Inc. (Делавэр, США; legal@saccadeproduction.com) собирает данные, которые вы вводите или загружаете в эту форму (имя, статус, адрес, налоговый номер, почта, подпись), и технические данные, которые записываются автоматически при подписи (IP-адрес, устройство, часовой пояс, выбранный язык, время каждого шага).

        Они нужны, чтобы заключить и исполнять этот договор и хранить доказательство договора. Правовое основание — это необходимо, чтобы заключить и исполнять договор с вами (если подписываете за компанию — наш законный интерес заключить его с ней), и наш законный интерес хранить доказательство договора и предъявлять требования или защищаться от них. По закону давать данные не обязательно, но без обязательных полей договор не подписать.

        Данные хранятся для нас у Hetzner на нашем сервере в Германии и на Google Диске: в резервных копиях, зашифрованных нашим ключом до загрузки (их Google прочитать не может), и как копии подписанного договора и журнала подписи. Письма о подписи уходят через нашего почтового провайдера Spacemail. С данными работаем из США и Израиля; для Израиля есть решение ЕС об адекватности, для нас в США — нет.

        Кроме этих провайдеров, передаём данные только аффилированному лицу, которое тоже подписывает договор (если есть), нашим юристам и бухгалтерам, а когда нужно доказать договор или добиться его исполнения, — клиенту и нашим аффилированным лицам, которых защищает договор, суду или властям.

        Храним, пока действует договор, и после — пока по нему можно предъявить требования.

        Напишите на legal@saccadeproduction.com, чтобы посмотреть, исправить или удалить свои данные, получить их копию, ограничить их использование или возразить против него; то, что ещё нужно для исполнения договора или для требований по нему и защиты от них, мы можем сохранить. Пожаловаться можно также в орган по защите данных страны, где вы живёте или работаете.
