# Тексты формы подписи DocuSeal — ЕДИНСТВЕННОЕ место, где они живут (с 24.11.2026).
# Сервер читает файл на лету: правка → `docs/infra/ds texts` (проверит и зальёт), перезапуск не нужен.
# Тексты в базе шаблонов (description, completed_message) больше не показываются, если поле есть здесь.
#
# fields:      по имени поля в шаблоне (как в редакторе DocuSeal). Общий текст для всех шаблонов.
#   title_ru:  название шага по-русски (по-английски — само имя поля)
#   hint:      подсказка под названием шага: en / ru, абзацы через пустую строку; ссылки — [текст](url)
# templates:   по id шаблона. name — для ориентира; name_ru — название документа по-русски;
#   fields:    переопределить текст поля только в этом шаблоне (hint: ~ — без подсказки);
#   completed_body: свой текст экрана после подписи.
# completed:   экран после подписи по умолчанию.  options_ru: варианты ответа (в документ уходит английское).
# title_patterns_ru: регулярка → русское название (Signature p.10 → Подпись, с. 10).
# name_parts_ru: замены в названии документа (тестовые копии).
#
# Новое поле → добавить сюда (title_ru + hint), иначе в RU шаг будет по-английски; `ds texts` покажет такие поля.
# Правила текста: в русском — русские названия кнопок («Далее», «Завершить»), имена собственные как есть.

completed:
  title:
    en: Thank you!
    ru: Спасибо!
  body:
    en: 'Saccade Media House will countersign the Agreement and send you a copy of the fully signed Agreement. Questions: legal@saccadeproduction.com.'
    ru: Saccade Media House подпишет договор со своей стороны и пришлёт вам копию договора, подписанного всеми сторонами. Вопросы — legal@saccadeproduction.com.
