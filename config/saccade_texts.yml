        I agree that I will submit a new form within 30 days if any certification on this form becomes incorrect.

        Your signature is the last step: when you sign and press Complete, the form is sent. Draw your signature with your finger or mouse. The form is marked as signed electronically, and the date and time of signing are recorded.
      ru: |-
        **Подписывая, вы делаете это заявление (раздел XXX формы) под страхом наказания за лжесвидетельство.** Прочитайте его до подписи. Перевод для удобства: в форме — английский текст, действует он.

        Под страхом наказания за лжесвидетельство заявляю, что проверил(а) сведения в этой форме и, насколько мне известно и по моему убеждению, они верны, точны и полны. Также под страхом наказания за лжесвидетельство подтверждаю, что:

        • компания из строки 1 этой формы — фактический получатель (бенефициар) всех доходов или поступлений, к которым относится эта форма, либо использует эту форму, чтобы подтвердить свой статус для целей главы 4, либо подаёт её для целей разделов 6050W или 6050Y;

        • компания из строки 1 этой формы не является «лицом США»;

        • форма относится: (a) к доходу, не связанному фактически с ведением торговли или бизнеса в США, (b) к доходу, фактически связанному с ведением торговли или бизнеса в США, но не облагаемому налогом по соглашению о подоходном налоге, (c) к доле партнёра в фактически связанном облагаемом доходе партнёрства или (d) к сумме, полученной партнёром при передаче доли в партнёрстве, с которой удерживается налог по разделу 1446(f); и

        • для брокерских операций и бартерных обменов фактический получатель — освобождённое иностранное лицо, как определено в инструкции.

        Кроме того, разрешаю передавать эту форму любому налоговому агенту, который контролирует, получает или хранит доход, фактическим получателем которого является компания из строки 1, либо который может распоряжаться таким доходом или выплачивать его.

        Обязуюсь подать новую форму в течение 30 дней, если любое заявление в этой форме станет неверным.

        Подпись — последний шаг: когда вы подпишете и нажмёте «Завершить», форма уйдёт. Нарисуйте подпись пальцем или мышью. В форме будет отметка, что она подписана электронно; дата и время подписи записываются.
